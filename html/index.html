<!DOCTYPE html>
<html>
    <style>
        .topbar {
            width: calc(100% - 20px);
            height: 5em;
            background-color: aqua;
            padding: 10px;
        }

        .floating {
            width: 50%;
            height: 60%;
            background-color: blueviolet;

            margin: 0;
            padding: 20px;
            position: absolute;
            top: 56%;
            left: 25%;
            -ms-transform: translateY(-50%);
            transform: translateY(-50%);
            border-radius: 30px;
        }

        body {
            margin: 0;
            background-image: url("wallpaper.jpg");
        }
    </style>

    <body>
        <div class="topbar"><a href="login.html"><img src="icon.png" style="float: right; margin: 0;"></a></div>
        <div class="floating"></div>
    </body>
</html>
